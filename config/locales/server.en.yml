  badge_groupings:
    research_fields:
      name: "Research Fields"
      description: "Badges awarded based on academic and research-focused group memberships."
    research_levels:
      name: "Research Levels"
      description: "Badges awarded based on academic and research-focused group memberships."
  badges:
    first_author:
      name: "First Author"
      description: "A badge awarded to the first author of the article."
    early_adopter:
      name: "Early Adopter"
      description: "A badge awarded to users who joined the platform early."
    verified:
      name: "Verified"
      description: "Awarded to users who have registered with a corporate or authorized email address."
      long_description: "This badge is automatically assigned by the system to users who verify their email address with a corporate domain. <br><br><b>Note:</b> If the email address is changed to a different domain, this badge will be automatically revoked."
    social_scientist:
      name: "Social Scientist"
      description: "Awarded for joining the Social Sciences community."
      long_description: "This badge is automatically assigned by the system every night to members who join the <b>Social Science</b> group on our platform. <br><br>If you leave the group, the badge will be automatically revoked."
    scientist:
      name: "Scientist"
      description: "Awarded for joining the Science community."
      long_description: "This badge is automatically assigned by the system to members who join the <b>Science</b> group on our platform. <br><br>If you leave the group, the badge will be automatically revoked."
    founding_member:
      name: "Founding Member"
      description: "Awarded to the elite first members who laid the foundation of the platform."
      long_description: "This exclusive badge is awarded to the elite members who were part of our community's founding stage and helped lay the foundation of the platform."
    gold_sponsor:
      name: "Gold Sponsor"
      description: "Awarded to institutions providing top-tier structural support to the BEKCAN Institute."
      long_description: "This badge is automatically assigned by the system to members who register with an email domain belonging to our Gold Sponsor partners. It recognizes their highest level of contribution and structural support to the BEKCAN Institute ecosystem. <br><br><b>Note:</b> If the email address is changed to a non-sponsor domain, this badge will be automatically revoked."
    silver_sponsor:
      name: "Silver Sponsor"
      description: "Awarded to institutions providing significant support to the BEKCAN Institute."
      long_description: "This badge is automatically assigned by the system to members who register with an email domain belonging to our Silver Sponsor partners, honoring their valuable contribution to independent academic research. <br><br><b>Note:</b> If the email address is changed to a non-sponsor domain, this badge will be automatically revoked."
    bronze_sponsor:
      name: "Bronze Sponsor"
      description: "Awarded to institutions supporting the BEKCAN Institute."
      long_description: "This badge is automatically assigned by the system to members who register with an email domain belonging to our Bronze Sponsor partners, acknowledging their foundational support. <br><br><b>Note:</b> If the email address is changed to a non-sponsor domain, this badge will be automatically revoked."
    verified_partner:
      name: "Verified Partner"
      description: "Awarded to verified academic and corporate partners of the BEKCAN Institute."
      long_description: "This badge is assigned to members belonging to organizations that collaborate with the BEKCAN Institute as verified business or academic partners. <br><br><b>Note:</b> If the email address is changed to an unverified domain, this badge will be automatically revoked."
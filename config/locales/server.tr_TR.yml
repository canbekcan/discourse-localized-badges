      long_description: "Bu rozet, BEKCAN Enstitüsü'ne destek veren Bronz Sponsor kurumların e-posta alan adlarıyla kayıt olan üyelere otomatik olarak atanır. <br><br><b>Not:</b> E-posta adresinin sponsor olmayan farklı bir alan adına değiştirilmesi durumunda bu rozet sistem tarafından otomatik olarak geri alınacaktır."

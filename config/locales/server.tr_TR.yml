      long_description: "Bu rozet, bağımsız akademik araştırmalara ve BEKCAN Enstitüsü'ne değerli katkılar sunan Gümüş Sponsor kurumların e-posta alan adlarıyla kayıt olan üyelere otomatik olarak atanır. <br><br><b>Not:</b> E-posta adresinin sponsor olmayan farklı bir alan adına değiştirilmesi durumunda bu rozet sistem tarafından otomatik olarak geri alınacaktır."
    bronze_sponsor:
